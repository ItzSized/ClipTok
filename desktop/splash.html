<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>ClipTok</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f5; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box; }
      .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #d946ef, #fb923c); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(217, 70, 239, 0.35); }
      .logo svg { width: 30px; height: 30px; margin-left: 4px; }
      h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
      #status { font-size: 12px; color: #a1a1aa; min-height: 16px; text-align: center; padding: 0 24px; }
      .bar { width: 200px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .bar div { width: 40%; height: 100%; background: linear-gradient(90deg, #d946ef, #fb923c); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .error #status { color: #fca5a5; }
      .error .bar { display: none; }
      .buttons { display: none; gap: 8px; -webkit-app-region: no-drag; }
      .error .buttons { display: flex; }
      button { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
      button:hover { background: rgba(255, 255, 255, 0.16); }
      button.primary { background: linear-gradient(90deg, #d946ef, #fb923c); border: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg viewBox="0 0 10 12"><path d="M0 0 L10 6 L0 12 Z" fill="white" /></svg>
    </div>
    <h1>ClipTok</h1>
    <div class="bar"><div></div></div>
    <div id="status">Démarrage…</div>
    <div class="buttons">
      <button class="primary" onclick="cliptok.action('retry')">Réessayer</button>
      <button onclick="cliptok.action('logs')">Journaux</button>
      <button onclick="cliptok.action('quit')">Quitter</button>
    </div>
    <script>
      cliptok.onStatus(({ text, state }) => {
        document.getElementById('status').textContent = text;
        document.body.classList.toggle('error', state === 'error');
      });
    </script>
  </body>
</html>
